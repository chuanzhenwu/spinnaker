steps:
# Step 1: Build the application using Gradle
- name: 'eclipse-temurin:17'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    ./gradlew --no-daemon front50:front50-web:installDist -x test

# Step 2: Build the Docker image
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--build-arg'
  - 'TARGETARCH=amd64'
  - '-t'
  - 'europe-west1-docker.pkg.dev/waze-ci/waze-spinnaker-images/front50:${_VERSION}'
  - '-t'
  - 'europe-west1-docker.pkg.dev/waze-ci/waze-spinnaker-images/front50:${_VERSION}-${COMMIT_SHA}'
  - '-f'
  - 'front50/Dockerfile.ubuntu'
  - 'front50'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '7200s'
images:
- 'europe-west1-docker.pkg.dev/waze-ci/waze-spinnaker-images/front50:${_VERSION}'
- 'europe-west1-docker.pkg.dev/waze-ci/waze-spinnaker-images/front50:${_VERSION}-${COMMIT_SHA}'
substitutions:
  _VERSION: '2026.3.2'
